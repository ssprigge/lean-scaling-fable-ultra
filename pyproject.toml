[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leanscale"
version = "0.1.0"
description = "Empirical scaling laws of coding-LLM predictability by programming language (implementation of Gwern's 'Lean Software Scaling Laws' measurement design)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
torch = ["torch", "transformers", "safetensors"]

[tool.setuptools]
packages = ["leanscale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
